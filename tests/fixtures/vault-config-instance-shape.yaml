# Generated by install-tomo.sh on 2026-04-20
# version: 0.2.0
schema_version: 1

profile: "miyo"
profile_version: "1.0"

concepts:
  inbox: "100 Inbox/"

  atomic_note:
    # M8: `path` (not `base_path`) so moc_scan.read_scope_paths and the
    # MOC-structure-cache builder pick up the atomic-note scope.
    path: "Atlas/202 Notes/"

  map_note:
    paths:
      - "Atlas/200 Maps/"
    tags:
      - "type/others/moc"

  calendar:
    base_path: "Calendar/"
    granularities:
      daily:
        enabled: true
        path: "Calendar/301 Daily/ "

  project: "Efforts/400 On/"
  area: "Efforts/500 OnGoing/"
  source: "X/600 Resources/602 External Sources/"
  template: "X/900 Support/930 Templater/"
  asset: "Atlas/290 Assets/295 Attachments/"

lifecycle:
  tag_prefix: "MiYo-Tomo"

tags:
  prefixes:
    type:
      description: "Note type (structural; set by templates on render)"
      known_values:
        - "note/normal"
        - "others/moc"
      wildcard: false
      proposable: false
      required_for:
        - atomic_note
        - map_note

    topic:
      description: "Topic area (free-form, hierarchical)"
      known_values:
        - "topic-a"
        - "topic-a/sub"
      wildcard: true
      proposable: true
      required_for: []

relationships:
  parent:
    marker: "up::"
    format: "up:: {{link}}"
    position: "connect_callout"
    location_type: "inline"
    multi: true
    separator: ", "
  peer:
    marker: "related::"
    format: "related:: {{link}}"
    position: "connect_callout"
    location_type: "inline"
    multi: true
    separator: ", "
callouts:
  enabled: true

  editable:
    connect: "Navigation breadcrumbs (up:: / related:: links) and Categories"
    anchor: "Overview section introduction"
    blocks: "Key Concepts section"
    video: "Action Items section (MOCs); closing divider (daily)"
    calendar: "Recent Updates section"
    puzzle: "Related Topics (links to other MOCs)"
    compass: "Something you should look at perhaps"

  protected:
    shell: "DataviewJS: possibly relevant, currently unmentioned notes"
    boxes: "Dataview/DataviewJS: unrequited notes (backlinks not linked)"
    keaton: "DataviewJS: other notes containing the title"
    rocket: "Dynbedded embed of Next Todos (daily)"
    EXAMPLE: "Dataview LIST queries for new/modified notes (daily)"
    sparkles: "Inline Dataview fields (this.yesterday.to-improve etc.)"
    activity: "Inline Dataview field (this.desired-outcome)"
    map: "Embedded PDF/image/note maps; ambiguous, not edited"
    METADATA: "Legacy Key:: value metadata block (VaultVersion 1); ambiguous, not edited"

  ignore:
    caution: "Scaffold reminder: REMOVE ALL STUFF YOU DON'T NEED"
    rainbow: "Daily section banner (weather)"
    recycle: "Daily section banner (habits)"
    orbit: "Daily section banner (5 year journal)"
    sun: "Daily section banner (start of the day)"
    venetian: "Daily section banner (closing)"
    todo: "Daily section banner (what needs to happen)"
templates:
  base_path: "X/900 Support/930 Templater/"
  mapping:
    map_note: "t_moc_tomo.md"
    map_note_interactive: "t_moc.md"
    atomic_note: "t_note_tomo.md"
    project: "t_project_tomo.md"
    source: "t_source_tomo.md"
    daily: "t_day_privat.md"
  note_include:
    - "t_*"

daily_log:
  enabled: true
  section: "Daily Log"
  heading_level: 2
  date_sources: [content, frontmatter, filename]
  time_extraction:
    enabled: true
    sources: [content, filename]
    fallback: append_end_of_day
  link_format: bullet
  cutoff_days: 120  # bumped from 30 for testing window — see docs/troubleshooting.md "Tracker / Daily-Log Update Skipped"
  auto_create_if_missing:
    past: false    # intent: true (post-MVP)
    today: false   # intent: true (post-MVP)
    future: false  # intent: true (post-MVP)

# ── Trackers ────────────────────────────────────────────────────────────
# Synthetic trackers; shape only. Migrated from wrong location (daily_log.trackers, written by
# /explore-vault v0.7.0). Field names + types preserved; syntax inferred
# as inline_field based on t_day_privat.md comment in source.
# description/positive_keywords/negative_keywords to be filled by
# /tomo-trackers-wizard.

trackers:
  daily_note_trackers:
    section: "Habit"
    today_fields:
      - name: "Sleep"
        type: "text"
        syntax: "inline_field"
        description: "Synthetic tracker."
        positive_keywords: ["slept"]
        negative_keywords: ["awake"]
    yesterday_fields:
      - name: "Break"
        type: "boolean"
        syntax: "inline_field"
        description: "Synthetic tracker."
        positive_keywords: ["break"]
        negative_keywords: ["none"]

  end_of_day_fields:
    section: "End of the Day"
    fields:
      - name: "Gratitude"
        type: "text"
        syntax: "inline_field"
        description: "Synthetic tracker."
        positive_keywords: ["grateful"]
        negative_keywords: ["ungrateful"]
# ──────────────────────────────────────────────────────────────────────────────
# Tomo Settings
# ──────────────────────────────────────────────────────────────────────────────

tomo:
  # MOC-structure cache scope/TTL (spec 021). Metadata-only scan; bodies never
  # stored. exclude_paths uses the trailing-space daily folder gotcha exactly.
  moc_structure_cache:
    scope_paths:
      - "Atlas/200 Maps/"
      - "Atlas/202 Notes/"
    exclude_paths:
      - "Calendar/301 Daily/ "
      - "X/"
    ttl_days: 1
    moc_tag: "type/others/moc"
