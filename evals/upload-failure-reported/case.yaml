schema_version: "1.1"
name: upload-failure-reported
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Agent, Bash]
  prompt: 'Use the Agent tool once: subagent_type `tomo:synthesis-conductor`, prompt "Run Pass 2 synthesis. The routing plan is at tomo-tmp/routing-plan.json. Follow your workflow Steps 1-4 exactly." Do not run any command yourself. When it returns, repeat its final report verbatim.'
